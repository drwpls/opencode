name: fork-build

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cli:
    name: cli (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-latest
          - name: macos-arm64
            runner: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build native CLI
        run: ./packages/opencode/script/build.ts --single
        env:
          OPENCODE_VERSION: 0.0.0-fork.${{ github.run_number }}
          OPENCODE_CHANNEL: local
          OPENCODE_RELEASE: ""
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-cli-${{ matrix.name }}
          path: packages/opencode/dist/opencode-*
          retention-days: 14

  publish-release:
    name: Publish public release assets
    needs: build-cli
    runs-on: ubuntu-latest
    steps:
      - name: Download CLI artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Package release archives
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for artifact_dir in artifacts/*; do
            artifact_name="$(basename "$artifact_dir")"
            tar -czf "release-assets/${artifact_name}-${GITHUB_SHA}.tar.gz" -C "$artifact_dir" .
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: opencode-cli-${{ github.sha }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "opencode CLI $GITHUB_SHA" \
              --notes "Fork CLI binaries built from $GITHUB_SHA."
          fi
